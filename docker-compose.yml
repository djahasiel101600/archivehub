services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: archivehub-app

    environment:
      NODE_ENV: production

      DATABASE_URL: ${DATABASE_URL}

      PGSSL: disable

      SESSION_SECRET: ${SESSION_SECRET}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

    #depends_on:
      #postgres:
        #condition: service_started

    volumes:
      - archivehub-uploads:/app/uploads

    restart: unless-stopped

    networks:
      - office-network

volumes:
  archivehub-uploads:

networks:
  office-network:
    external: true